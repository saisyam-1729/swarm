# PURPOSE: Defines the production SWARM Docker Compose services (TimescaleDB, backend, frontend, MQTT).
name: swarm_webapp
services:
  postgres:
    image: timescale/timescaledb:2.30.1-pg16
    container_name: swarm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-swarm}
      POSTGRES_USER: ${DB_USER:-swarm}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - swarm_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-swarm} -d ${DB_NAME:-swarm}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - swarm
    # Database is internal-only. Do not publish 5432 on the host.

  postgres-bootstrap:
    image: timescale/timescaledb:2.30.1-pg16
    container_name: swarm-postgres-bootstrap
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${DB_NAME:-swarm}
      POSTGRES_USER: ${DB_USER:-swarm}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      BOOTSTRAP_MARKER: /state/swarm_app_bootstrapped
    volumes:
      - swarm_bootstrap_state:/state
      - ./backups:/backups:ro
      - ./database/reset-non-nova.sql:/reset/reset-non-nova.sql:ro
      - ./database/swarm-core-init.sql:/init/swarm-core-init.sql:ro
      - ./docker/postgres/bootstrap.sh:/bootstrap.sh:ro
    entrypoint: ["/bin/bash", "/bootstrap.sh"]
    networks:
      - swarm

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: swarm-mqtt
    restart: unless-stopped
    environment:
      MQTT_BACKEND_USER: ${MQTT_USER:-swarm-backend}
      MQTT_BACKEND_PASSWORD: ${MQTT_PASSWORD:-changeme-mqtt-backend}
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./docker/mosquitto/entrypoint.sh:/entrypoint.sh:ro
      - swarm_mqtt_data:/mosquitto/data
    # Host 1883 is used by swarm-iot-mosquitto. Publish loopback 1884 only so LAN tests can
    # reach SWARM Mosquitto without competing for 1883. Backend still uses mosquitto:1883.
    ports:
      - "127.0.0.1:1884:1883"
    networks:
      - swarm

  backend:
    build: ./backend
    container_name: swarm-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_FLYWAY_VALIDATE_ON_MIGRATE: "true"
      # Local Compose DB. For Pi→cloud demo, set SPRING_DATASOURCE_URL / DB_* in .env instead.
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-swarm}
      DB_USER: ${DB_USER:-swarm}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_SSL_MODE: ${DB_SSL_MODE:-disable}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:80}
      SWARM_CORS_ALLOW_ANY_HTTP: ${SWARM_CORS_ALLOW_ANY_HTTP:-true}
      SWARM_IOT_COMPAT_LEGACY: ${SWARM_IOT_COMPAT_LEGACY:-false}
      MQTT_ENABLED: ${MQTT_ENABLED:-false}
      MQTT_BROKER: ${MQTT_BROKER:-tcp://mosquitto:1883}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-swarm-backend}
      MQTT_USER: ${MQTT_USER:-swarm-backend}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-changeme-mqtt-backend}
      MQTT_SWARM_TOPIC: ${MQTT_SWARM_TOPIC:-swarm/v1/+/+/+/telemetry}
      MQTT_TRUST_BROKER_ACLS: ${MQTT_TRUST_BROKER_ACLS:-true}
      SWARM_BOOTSTRAP_ADMIN_EMAIL: ${SWARM_BOOTSTRAP_ADMIN_EMAIL:-}
      SWARM_BOOTSTRAP_ADMIN_PASSWORD: ${SWARM_BOOTSTRAP_ADMIN_PASSWORD:-}
      SWARM_SEED_DEMO_ACCOUNTS: ${SWARM_SEED_DEMO_ACCOUNTS:-false}
      SWARM_SEED_DEMO_PASSWORD: ${SWARM_SEED_DEMO_PASSWORD:-}
      SWARM_PARTNER_SANDBOX_ENABLED: ${SWARM_PARTNER_SANDBOX_ENABLED:-false}
      SERVER_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
      postgres-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    ports:
      - "8080:8080"
    networks:
      - swarm

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    container_name: swarm-frontend
    restart: unless-stopped
    environment:
      PORT: "8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s
    ports:
      - "80:8080"
    networks:
      - swarm

volumes:
  swarm_pg_data:
  swarm_mqtt_data:
  swarm_bootstrap_state:

networks:
  swarm:
    driver: bridge
