# PURPOSE: Default Spring configuration for PostgreSQL, JWT, MQTT, and CORS.
spring:
  application:
    name: biopower-monitoring
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: ${FLYWAY_VALIDATE_ON_MIGRATE:true}
    locations: classpath:db/migration
  datasource:
    # Prefer SPRING_DATASOURCE_URL for cloud TLS URLs. Otherwise compose from DB_* + DB_SSL_MODE.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:swarm}?sslmode=${DB_SSL_MODE:prefer}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:swarm}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: 5000
      # Fail startup quickly when the cloud DB is unreachable.
      initialization-fail-timeout: ${DB_INIT_FAIL_TIMEOUT_MS:30000}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${PORT:${SERVER_PORT:8080}}
  shutdown: graceful
  servlet:
    context-path: /api

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

mqtt:
  enabled: ${MQTT_ENABLED:false}
  broker-url: ${MQTT_BROKER:tcp://localhost:1883}
  client-id: ${MQTT_CLIENT_ID:swarm-backend}
  topic: ${MQTT_LEGACY_TOPIC:biopower/sensors/#}
  swarm-topic: ${MQTT_SWARM_TOPIC:swarm/v1/+/+/+/telemetry}
  username: ${MQTT_USER:}
  password: ${MQTT_PASSWORD:}
  ingest-max-attempts: ${MQTT_INGEST_MAX_ATTEMPTS:3}
  ingest-retry-delay-ms: ${MQTT_INGEST_RETRY_DELAY_MS:200}
  # Subscriber path cannot see publisher passwords. true = trust broker ACLs that
  # restrict swarm/v1/{tenant}/{plant}/{deviceUid}/telemetry to that device UID.
  # Tests set false. Demo Mosquitto must use password + per-device ACL (no anonymous).
  trust-broker-acls: ${MQTT_TRUST_BROKER_ACLS:true}

biopower:
  bootstrap:
    admin-email: ${SWARM_BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${SWARM_BOOTSTRAP_ADMIN_PASSWORD:}
  seed:
    demo-accounts: ${SWARM_SEED_DEMO_ACCOUNTS:false}
    demo-password: ${SWARM_SEED_DEMO_PASSWORD:}
    pid-demo: ${SWARM_SEED_PID_DEMO:false}
  iot:
    compat-legacy: ${SWARM_IOT_COMPAT_LEGACY:true}
    max-payload-readings: ${SWARM_IOT_MAX_READINGS:64}
  rate-limit:
    ingest-per-minute: ${SWARM_RATE_INGEST_PER_MIN:120}
    login-per-minute: ${SWARM_RATE_LOGIN_PER_MIN:20}
  identity:
    mode: ${IDENTITY_MODE:local}
    saas:
      accounts-url: ${SAAS_ACCOUNTS_URL:https://accounts.empowerapp.in}
      client-id: ${SAAS_CLIENT_ID:swarm_webapp}
      client-secret: ${SAAS_CLIENT_SECRET:}
      app-url: ${SAAS_APP_URL:http://localhost:3000}
      token-path: /api/oauth/token
  alert:
    ph-min: 6.5
    ph-max: 8.5
    temp-min: 25.0
    temp-max: 45.0
    pressure-max: 2.5
    sensor-timeout-minutes: 10
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,https://localhost,capacitor://localhost,https://app.swarm.co.in,https://control.swarm.co.in}
    allow-any-http-origin: ${SWARM_CORS_ALLOW_ANY_HTTP:true}
  deployment:
    role: ${SWARM_DEPLOYMENT_ROLE:primary}
  retention:
    sensor-readings-days: ${SENSOR_RETENTION_DAYS:30}
    ai-recommendations-days: ${AI_RECOMMENDATION_RETENTION_DAYS:30}
    ai-recommendations-per-plant: ${AI_RECOMMENDATION_MAX_PER_PLANT:100}
    nova-messages-days: ${NOVA_MESSAGE_RETENTION_DAYS:90}
  swarm:
    public-api-url: ${SWARM_PUBLIC_API_URL:}
    mqtt-public-host: ${SWARM_MQTT_PUBLIC_HOST:127.0.0.1}
    mqtt-public-port: ${SWARM_MQTT_PUBLIC_PORT:1884}
    mqtt-internal-host: ${SWARM_MQTT_INTERNAL_HOST:mosquitto}
    mqtt-internal-port: ${SWARM_MQTT_INTERNAL_PORT:1883}
    partner:
      sandbox:
        enabled: ${SWARM_PARTNER_SANDBOX_ENABLED:false}
  nova-space-op:
    enabled: ${NOVA_SPACE_OP_ENABLED:true}
    llm:
      base-url: ${NOVA_LLM_BASE_URL:https://api.openai.com/v1}
      api-key: ${NOVA_LLM_API_KEY:}
      model: ${NOVA_LLM_MODEL:gpt-4o-mini}
    think:
      enabled: ${NOVA_THINK_ENABLED:true}
      confidence-threshold: 0.65
    narrate:
      enabled: ${NOVA_NARRATE_ENABLED:true}

logging:
  level:
    com.biopower: INFO
    org.springframework.security: WARN
