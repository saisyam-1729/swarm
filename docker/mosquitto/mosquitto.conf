# PURPOSE: Mosquitto for SWARM demo — authenticated access only.
# Create additional device users with mosquitto_passwd (see docs/MQTT_INTEGRATION.md).
# Backend subscriber: MQTT_USER / MQTT_PASSWORD
# Devices: username = deviceUid, password = device secret (broker ACLs recommended)

listener 1883
allow_anonymous false
password_file /mosquitto/data/passwd

persistence true
persistence_location /mosquitto/data/
log_dest stdout
